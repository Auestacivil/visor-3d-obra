<!DOCTYPE html>
<html lang="es">
<head>
    <title>Inspección Humax - Cota Real 7.00m</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f4f4f4; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botón de AR */
        #ar-button {
            background-color: #d9534f; color: white; border-radius: 30px;
            border: none; position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); padding: 18px 36px;
            font-weight: bold; font-size: 18px; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        /* Marcador del QR en el piso */
        .dot-qr {
            width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid #ffffff; background-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        .label {
            background: #fff; border-radius: 4px; padding: 4px 8px;
            font-size: 12px; font-weight: bold; position: absolute;
            white-space: nowrap; top: 30px; left: 50%; transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        
        /* El centro de rotación en pantalla será la máquina a 7m */
        camera-target="0m 7.00m 0m" 
        
        camera-controls 
        shadow-intensity="1">

        <button class="dot-qr" slot="hotspot-0" data-position="0m 0m 0m">
            <div class="label">PUNTO CERO (QR)</div>
        </button>

        <button class="dot-qr" slot="hotspot-1" data-position="0m 7.00m 0m" style="background-color: #007bff;">
            <div class="label" style="top: -35px;">MÁQUINA (COTA 7.00)</div>
        </button>

        <button slot="ar-button" id="ar-button">
            INICIAR AR (ESCALA 1:1)
        </button>

    </model-viewer>

</body>
</html>
