<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor Alinco - Carga Dinámica</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; }
        
        /* Panel de Control Estilizado */
        #ui-panel {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(255, 255, 255, 0.95); padding: 20px;
            border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            z-index: 100; color: #333; display: flex; flex-direction: column; gap: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 13px; text-transform: uppercase; color: #555; }
        
        input[type="number"], input[type="file"] {
            padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px;
        }

        /* Estilo para el botón de carga de archivo */
        .file-custom {
            background: #f8f9fa; border: 2px dashed #007bff; padding: 10px;
            text-align: center; cursor: pointer; border-radius: 6px;
        }

        button#ar-start {
            background-color: #d9534f; color: white; border: none;
            padding: 15px; border-radius: 8px; font-weight: bold;
            font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button#ar-start:hover { background-color: #c9302c; }

        model-viewer { width: 100vw; height: 100vh; background-color: #222; }

        /* Botón de AR nativo (oculto para usar el nuestro) */
        #ar-button { display: none; }

        .dot-qr { width: 22px; height: 22px; border-radius: 50%; background: red; border: 3px solid white; box-shadow: 0 0 10px red; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="input-group">
            <label>1. Seleccionar Modelo (.glb)</label>
            <input type="file" id="file-input" accept=".glb">
        </div>

        <div class="input-group">
            <label>2. Altura de Diseño (Z en metros)</label>
            <input type="number" id="height-input" placeholder="Ej: 7.00" step="0.01" value="0.00">
        </div>

        <button id="ar-start">ACTIVAR REALIDAD AUMENTADA</button>
    </div>

    <model-viewer 
        id="viewer"
        src="" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="0m 0m 0m" 
        camera-controls 
        shadow-intensity="1">

        <button class="dot-qr" slot="hotspot-qr" data-position="0m 0m 0m" data-normal="0m 1m 0m"></button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');
        const fileInput = document.querySelector('#file-input');
        const heightInput = document.querySelector('#height-input');
        const arBtn = document.querySelector('#ar-start');

        // Cargar el archivo seleccionado
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                viewer.src = url;
            }
        });

        // Activar AR con los parámetros definidos
        arBtn.addEventListener('click', () => {
            if (!viewer.src) {
                alert("Por favor, selecciona primero un archivo .glb");
                return;
            }
            const z = heightInput.value || 0;
            viewer.cameraTarget = `0m ${z}m 0m`;
            viewer.activateAR();
        });
    </script>

</body>
</html>
