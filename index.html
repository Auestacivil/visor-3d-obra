<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor de Inspección de Obra - Humax</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #f8f9fa;
        }
        #ar-button {
            background-color: #007bff;
            border-radius: 10px;
            border: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="-4.85m 3.89m 7.16m" 
        camera-controls 
        shadow-intensity="1" 
        tone-mapping="neutral"
        exposure="1">

        <button slot="ar-button" id="ar-button">
            INICIAR INSPECCIÓN (1:1)
        </button>

    </model-viewer>

</body>
</html>
