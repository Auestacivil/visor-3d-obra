<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #ui { position: fixed; top: 10px; left: 10px; z-index: 1000; background: white; padding: 10px; border-radius: 8px; }
        .status { font-size: 10px; color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div style="font-weight: bold;">ALINCO AR - INSPECCIÓN</div>
        <div id="status-text" class="status">ESPERANDO QR...</div>
        <button onclick="location.reload()" style="margin-top:5px;">Recargar App</button>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: true; maxTrack: 1;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="modeloBim" src="3dExport.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="example-target" mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="modelo-render"
                src="#modeloBim" 
                position="0 0 0" 
                rotation="90 0 0" 
                scale="0.1 0.1 0.1">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const targetEl = document.querySelector('#example-target');
        const statusText = document.querySelector('#status-text');

        // Detectar cuando el iPhone encuentra el QR
        targetEl.addEventListener("targetFound", event => {
            statusText.innerText = "¡QR DETECTADO!";
            statusText.style.color = "green";
        });

        targetEl.addEventListener("targetLost", event => {
            statusText.innerText = "QR PERDIDO - APUNTE AL CÓDIGO";
            statusText.style.color = "red";
        });
    </script>
</body>
</html>
