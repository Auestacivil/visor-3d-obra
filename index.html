<!DOCTYPE html>
<html lang="es">
<head>
    <title>Alinco - Control Maestro BIM</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root { --primary: #004a99; --accent: #d9534f; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1a1a1a; }
        
        /* Panel de Control Estilo Ingeniería */
        #ui-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px;
            z-index: 1000; color: #333; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border-left: 5px solid var(--primary);
        }

        h2 { margin: 0 0 10px 0; font-size: 14px; color: var(--primary); text-transform: uppercase; }

        /* Estilos de las cajas de texto XYZ */
        .coord-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-box { flex: 1; }
        .input-box label { display: block; font-size: 9px; font-weight: bold; color: #666; margin-bottom: 2px; }
        .input-box input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }

        /* Estilos de Selectores de Color */
        .color-row { display: flex; gap: 15px; margin-bottom: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .color-item { flex: 1; text-align: center; }
        .color-item label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 5px; }
        .color-item input { width: 40px; height: 40px; border: none; cursor: pointer; background: none; }

        .btn-main {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        /* Visor 3D */
        model-viewer { width: 100vw; height: 100vh; background-color: #1a1a1a; }

        /* Hotspots */
        .dot-qr { width: 20px; height: 20px; border-radius: 50%; background: red; border: 3px solid white; }
        .label { background: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2>Alinco Ingeniería - Control Pro</h2>
        
        <div class="coord-row">
            <div class="input-box">
                <label>X (Lateral)</label>
                <input type="number" id="pos-x" value="0.0" step="0.1">
            </div>
            <div class="input-box">
                <label>Y (Altura)</label>
                <input type="number" id="pos-y" value="7.0" step="0.1">
            </div>
            <div class="input-box">
                <label>Z (Profund.)</label>
                <input type="number" id="pos-z" value="0.0" step="0.1">
            </div>
        </div>

        <div class="color-row">
            <div class="color-item">
                <label>TUBERÍAS</label>
                <input type="color" id="pipe-color" value="#ff6600" onchange="updateColors('pipe', this.value)">
            </div>
            <div class="color-item">
                <label>COLUMNAS</label>
                <input type="color" id="col-color" value="#808080" onchange="updateColors('column', this.value)">
            </div>
            <div class="color-item">
                <label>DUCTOS</label>
                <input type="color" id="duct-color" value="#00ff00" onchange="updateColors('duct', this.value)">
            </div>
        </div>

        <button class="btn-main" onclick="updateCamera()">IR A UBICACIÓN XYZ</button>
    </div>

    <model-viewer 
        id="alinco-viewer"
        src="3dExport.glb" 
        ar ar-modes="webxr quick-look" ar-scale="fixed"
        camera-controls 
        shadow-intensity="2.5" 
        shadow-softness="0.3"
        exposure="1.2"
        environment-image="neutral"
        tone-mapping="commerce">

        <button class="dot-qr" slot="hotspot-0" data-position="0 0 0">
            <div class="label" style="transform: translateY(-20px)">ORIGEN QR</div>
        </button>

    </model-viewer>

    <script>
        const viewer = document.querySelector('#alinco-viewer');

        // 1. FORZAR OPACIDAD AL CARGAR (Quita las transparencias de Revit)
        viewer.addEventListener('load', () => {
            const model = viewer.model;
            model.materials.forEach((material) => {
                material.setAlphaMode("OPAQUE");
                // Mantiene texturas originales pero sólidas
                material.pbrMetallicRoughness.setRoughnessFactor(0.5);
            });
            console.log("Modelo sólido cargado.");
        });

        // 2. FUNCIÓN PARA MOVER CÁMARA (XYZ)
        function updateCamera() {
            const x = document.querySelector('#pos-x').value;
            const y = document.querySelector('#pos-y').value;
            const z = document.querySelector('#pos-z').value;
            
            // Movemos el objetivo de la cámara a las coordenadas de las cajas de texto
            viewer.cameraTarget = `${x}m ${y}m ${z}m`;
        }

        // 3. FUNCIÓN PARA CAMBIAR COLORES POR SISTEMA
        function updateColors(keyword, hexColor) {
            const rgb = hexToRgb(hexColor);
            viewer.model.materials.forEach((mat) => {
                // Si el nombre del material en Revit contiene la palabra (ej: 'pipe')
                if (mat.name.toLowerCase().includes(keyword.toLowerCase())) {
                    mat.pbrMetallicRoughness.setBaseColorFactor([rgb.r/255, rgb.g/255, rgb.b/255, 1]);
                }
            });
        }

        // Utilidad para convertir colores
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
    </script>
</body>
</html>
