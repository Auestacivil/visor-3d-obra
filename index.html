<!DOCTYPE html>
<html lang="es">
<head>
    <title>Alinco - Inspección Pro</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #d9534f; --go-zero: #007bff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; overflow: hidden; }
        
        /* Panel de Control */
        #ui-container {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 100;
            transition: transform 0.3s ease-in-out;
        }

        #ui-panel {
            background: rgba(255, 255, 255, 0.95); margin: 10px; padding: 20px;
            border-radius: 12px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #666; }
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; box-sizing: border-box; }

        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; background-color: var(--accent); color: white; }
        
        /* BOTÓN DE RETORNO AL ORIGEN (Visible en AR) */
        #go-to-zero {
            position: absolute;
            bottom: 120px; /* Arriba del botón nativo de AR */
            right: 20px;
            background-color: var(--go-zero);
            color: white;
            border: 2px solid white;
            border-radius: 50px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            display: none; /* Se activa por JS */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        #toggle-ui { position: absolute; top: 15px; right: 15px; background: var(--primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-weight: bold; z-index: 101; }

        model-viewer { width: 100vw; height: 100vh; background-color: #222; }
        .dot-qr { width: 24px; height: 24px; border-radius: 50%; background: #ff0000; border: 3px solid white; box-shadow: 0 0 15px red; }
        #ar-button { display: none; }
    </style>
</head>
<body>

    <button id="toggle-ui">▲</button>

    <button id="go-to-zero">📍 IR A ORIGEN 0</button>

    <div id="ui-container">
        <div id="ui-panel">
            <div class="header" style="display:flex; justify-content:space-between; color:var(--primary); font-weight:bold; margin-bottom:10px;">
                <span>ALINCO INGENIERÍA</span>
                <span>V3.1</span>
            </div>
            <div class="group">
                <label>COTA DE INSPECCIÓN (Z)</label>
                <input type="number" id="z-height" value="0.00" step="0.01">
            </div>
            <button class="btn-main" id="start-ar">PROYECTAR EN OBRA</button>
        </div>
    </div>

    <model-viewer 
        id="alinco-viewer"
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-controls 
        shadow-intensity="1">
        
        <button class="dot-qr" slot="hotspot-0" data-position="0 0 0" data-normal="0 1 0"></button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#alinco-viewer');
        const heightIn = document.querySelector('#z-height');
        const arBtn = document.querySelector('#start-ar');
        const zeroBtn = document.querySelector('#go-to-zero');
        const toggleBtn = document.querySelector('#toggle-ui');
        const uiContainer = document.querySelector('#ui-container');

        // Mostrar el botón de "Ir a Cero" solo cuando estemos en AR
        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                zeroBtn.style.display = 'block';
            } else {
                zeroBtn.style.display = 'none';
            }
        });

        // Lógica del botón: Resetear cámara al suelo (0,0,0)
        zeroBtn.addEventListener('click', () => {
            viewer.cameraTarget = "0m 0m 0m";
            viewer.cameraOrbit = "0deg 75deg 2m";
            // Pequeña vibración para confirmar acción
            if (navigator.vibrate) navigator.vibrate(50);
        });

        // Toggle UI
        let uiVisible = true;
        toggleBtn.addEventListener('click', () => {
            uiVisible = !uiVisible;
            uiContainer.style.transform = uiVisible ? 'translateY(0)' : 'translateY(-120%)';
            toggleBtn.textContent = uiVisible ? '▲' : '▼';
        });

        arBtn.addEventListener('click', () => {
            const h = heightIn.value || 0;
            viewer.cameraTarget = `0m ${h}m 0m`;
            viewer.cameraOrbit = `45deg 75deg 2m`; 
            viewer.activateAR();
        });
    </script>
</body>
</html>
