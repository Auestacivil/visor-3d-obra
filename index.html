<!DOCTYPE html>
<html lang="es">
<head>
    <title>Alinco - Control Maestro V9.0</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root { --primary: #004a99; --accent: #ff6600; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #1a1a1a; color: #333; }
        
        #ui-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.96); padding: 15px; border-radius: 12px;
            z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 5px solid var(--primary);
        }

        .section-title { font-size: 10px; font-weight: bold; color: var(--primary); margin-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid #eee; }

        /* Filas de control */
        .row { display: flex; gap: 8px; margin-bottom: 12px; }
        .item { flex: 1; }
        label { display: block; font-size: 9px; font-weight: bold; margin-bottom: 3px; color: #666; }
        input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        
        /* Selectores de color */
        .color-grid { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .color-box { text-align: center; }
        input[type="color"] { width: 45px; height: 45px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; background: none; }

        .btn-apply {
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,74,153,0.3);
        }

        model-viewer { width: 100vw; height: 100vh; background-color: #1a1a1a; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-weight:bold;">ALINCO INGENIERÍA</span>
            <span style="font-size:10px; background:#eee; padding:2px 5px; border-radius:3px;">BIM V9.0</span>
        </div>

        <div class="section-title">Ubicación de Cámara (XYZ)</div>
        <div class="row">
            <div class="item"><label>X</label><input type="number" id="pos-x" value="0.0"></div>
            <div class="item"><label>Y (ALTO)</label><input type="number" id="pos-y" value="7.0"></div>
            <div class="item"><label>Z</label><input type="number" id="pos-z" value="0.0"></div>
        </div>

        <div class="section-title">Colores de Sistemas</div>
        <div class="color-grid">
            <div class="color-box">
                <label>TUBERÍAS</label>
                <input type="color" id="pipe-color" value="#ff6600">
            </div>
            <div class="color-box">
                <label>COLUMNAS</label>
                <input type="color" id="col-color" value="#808080">
            </div>
            <div class="color-box">
                <label>DUCTOS</label>
                <input type="color" id="duct-color" value="#00ff00">
            </div>
        </div>

        <button class="btn-apply" onclick="aplicarCambios()">ACTUALIZAR MODELO</button>
    </div>

    <model-viewer 
        id="viewer"
        src="3dExport.glb" 
        ar ar-modes="webxr quick-look" ar-scale="fixed"
        camera-controls 
        shadow-intensity="2" 
        exposure="1.2"
        environment-image="neutral">
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');

        // Al cargar, forzar opacidad para que nada se vea transparente
        viewer.addEventListener('load', () => {
            viewer.model.materials.forEach(m => m.setAlphaMode("OPAQUE"));
        });

        function aplicarCambios() {
            if (!viewer.model) return;

            // 1. ACTUALIZAR UBICACIÓN (XYZ)
            const x = document.querySelector('#pos-x').value;
            const y = document.querySelector('#pos-y').value;
            const z = document.querySelector('#pos-z').value;
            viewer.cameraTarget = `${x}m ${y}m ${z}m`;

            // 2. ACTUALIZAR COLORES
            const pColor = hexToRgb(document.querySelector('#pipe-color').value);
            const cColor = hexToRgb(document.querySelector('#col-color').value);
            const dColor = hexToRgb(document.querySelector('#duct-color').value);

            viewer.model.materials.forEach((mat) => {
                const name = mat.name.toLowerCase();
                
                // Tuberías (Keywords: pipe, tuberia)
                if (name.includes('pipe') || name.includes('tuberi')) {
                    mat.pbrMetallicRoughness.setBaseColorFactor([pColor.r/255, pColor.g/255, pColor.b/255, 1]);
                }
                // Columnas (Keywords: column, columna, struct)
                if (name.includes('column') || name.includes('columna') || name.includes('struct')) {
                    mat.pbrMetallicRoughness.setBaseColorFactor([cColor.r/255, cColor.g/255, cColor.b/255, 1]);
                }
                // Ductos (Keywords: duct)
                if (name.includes('duct')) {
                    mat.pbrMetallicRoughness.setBaseColorFactor([dColor.r/255, dColor.g/255, dColor.b/255, 1]);
                }
            });

            // Feedback visual en el botón
            const btn = document.querySelector('.btn-apply');
            btn.innerText = "¡CAMBIOS APLICADOS!";
            btn.style.background = "#28a745";
            setTimeout(() => {
                btn.innerText = "ACTUALIZAR MODELO";
                btn.style.background = "#004a99";
            }, 2000);
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return {r, g, b};
        }
    </script>
</body>
</html>
