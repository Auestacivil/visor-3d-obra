<!DOCTYPE html>
<html lang="es">
<head>
    <title>App de Inspección - Humax</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #f0f0f0; }
        
        /* Panel de Control Superior */
        #ui-panel {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.9); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 100; display: flex; flex-direction: column; gap: 10px;
        }

        label { font-weight: bold; font-size: 14px; color: #333; }
        
        input {
            padding: 10px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 16px; width: 100%; box-sizing: border-box;
        }

        button#update-btn {
            background-color: #007bff; color: white; border: none;
            padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        /* Visor 3D */
        model-viewer { width: 100vw; height: 100vh; background-color: #eee; }

        #ar-button {
            background-color: #d9534f; color: white; border-radius: 30px;
            border: none; position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); padding: 15px 35px;
            font-weight: bold; font-size: 18px; z-index: 10;
        }

        .dot-qr { width: 20px; height: 20px; border-radius: 50%; background: red; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <label for="height-input">Altura de Inspección (Metros):</label>
        <input type="number" id="height-input" placeholder="Ej: 7.00" step="0.01" value="0.00">
        <button id="update-btn">ACTUALIZAR VISOR</button>
        <div id="status" style="font-size: 11px; color: #666;">Punto 0 fijado en QR</div>
    </div>

    <model-viewer 
        id="viewer"
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="0m 0m 0m" 
        camera-controls 
        shadow-intensity="1">

        <button class="dot-qr" slot="hotspot-qr" data-position="0m 0m 0m" data-normal="0m 1m 0m"></button>

        <button slot="ar-button" id="ar-button">INICIAR AR</button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');
        const heightInput = document.querySelector('#height-input');
        const updateBtn = document.querySelector('#update-btn');

        updateBtn.addEventListener('click', () => {
            const zHeight = heightInput.value || 0;
            // Cambiamos el objetivo de la cámara dinámicamente
            viewer.cameraTarget = `0m ${zHeight}m 0m`;
            alert(`Visor ajustado a ${zHeight} metros`);
        });
    </script>

</body>
</html>
