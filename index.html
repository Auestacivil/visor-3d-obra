<!DOCTYPE html>
<html lang="es">
<head>
    <title>Inspección Maquinaria - Altura 1.70m</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f8f9fa; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* El punto rojo central */
        .dot {
            width: 24px; height: 24px; border-radius: 50%;
            border: 3px solid #ffffff; background-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        /* Etiqueta del punto */
        .label {
            background: #fff; border-radius: 4px; color: #333;
            font-size: 12px; font-weight: bold; padding: 4px 8px;
            white-space: nowrap; position: absolute;
        }

        #ar-button {
            background-color: #d9534f; color: white; border-radius: 30px;
            border: none; position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); padding: 18px 36px;
            font-weight: bold; font-size: 18px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3); z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        
        /* CAMBIO 1: El visor ahora mirará a 1.70m */
        camera-target="0m 1.70m 0m" 
        
        camera-controls 
        shadow-intensity="1">

        <button class="dot" slot="hotspot-suelo" data-position="0m 0m 0m">
            <div class="label" style="top: 30px; left: 50%; transform: translateX(-50%);">ORIGEN QR</div>
        </button>

        <button class="dot" slot="hotspot-viga" data-position="0m 1.70m 0m" style="background-color: #007bff;">
            <div class="label" style="top: -35px; left: 50%; transform: translateX(-50%);">MAQUINA A 1.70m</div>
        </button>

        <button slot="ar-button" id="ar-button">
            INICIAR INSPECCIÓN
        </button>

    </model-viewer>

</body>
</html>
