<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor 3D Obra</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body { margin: 0; }
    model-viewer {
      width: 100%;
      height: 100vh;
      background: #f2f2f2;
    }

    #btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #d9534f;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
    }
  </style>
</head>


<body>

<model-viewer 
  id="viewer"
  src="3dExport.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-scale="fixed"
  camera-controls
  shadow-intensity="1">
</model-viewer>

<button id="btn">RE-CALIBRAR VIGA</button>

<script>
const params = new URLSearchParams(window.location.search);
const viewer = document.getElementById("viewer");

// Parámetros desde QR
const target = params.get("target");
const orbit = params.get("orbit");

if (target) {
  viewer.setAttribute("camera-target", target.replace(/,/g, " "));
}

if (orbit) {
  viewer.setAttribute("camera-orbit", orbit.replace(/,/g, " "));
}

// Botón recalibrar
document.getElementById("btn").onclick = () => {
  viewer.setAttribute("camera-target", "0m 3.89m 0m");
  viewer.setAttribute("camera-orbit", "0deg 75deg 5m");
};
</script>

</body>
</html>
