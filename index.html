<!DOCTYPE html>
<html lang="es">
<head>
    <title>Humax - Alineación QR</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #ffffff; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Estilo del único punto de control (QR) */
        .dot-qr {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        /* Botón de AR */
        #ar-button {
            background-color: #d9534f;
            color: white;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="0m 0m 0m" 
        camera-controls 
        shadow-intensity="1">

        <button class="dot-qr" slot="hotspot-qr" data-position="0m 0m 0m" data-normal="0m 1m 0m">
        </button>

        <button slot="ar-button" id="ar-button">
            INICIAR INSPECCIÓN
        </button>

    </model-viewer>

</body>
</html>
