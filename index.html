<!DOCTYPE html>
<html lang="es">
<head>
    <title>Control de Obra - Humax</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; background-color: #f0f0f0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botón principal de Realidad Aumentada */
        #ar-button {
            background-color: #d9534f;
            color: white;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            z-index: 10;
            cursor: pointer;
        }

        /* Marcador visual del punto de apoyo (QR) */
        .hotspot-qr {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background-color: #ff0000;
            box-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="0m 4.30m 0m" 
        camera-controls 
        shadow-intensity="1"
        exposure="1.1">

        <button class="hotspot-qr" slot="hotspot-base" data-position="0m 0m 0m" data-normal="0m 1m 0m">
        </button>

        <button slot="ar-button" id="ar-button">
            INICIAR INSPECCIÓN (ALTURA 4.30m)
        </button>

    </model-viewer>

</body>
</html>
</html>
