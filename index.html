<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor de Inspección - Equipos Naranjas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #ff6600; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #1a1a1a; }
        
        #ui-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 12px;
            z-index: 100; color: #333; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .btn-update {
            width: 100%; padding: 12px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-weight: bold;
        }

        model-viewer { width: 100vw; height: 100vh; background-color: #222; }
        .dot-qr { width: 20px; height: 20px; border-radius: 50%; background: red; border: 3px solid white; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: var(--primary); margin-bottom: 5px;">CONTROL DE INSPECCIÓN</div>
        <div style="font-size: 11px; margin-bottom: 10px;">ESTADO: EQUIPOS NARANJAS / OPACIDAD FORZADA</div>
        <input type="number" id="z-val" value="7.00" step="0.1" style="width: 60px; padding: 5px;"> m
        <button class="btn-update" id="btn-update">ACTUALIZAR COTA Z</button>
    </div>

    <model-viewer 
        id="viewer"
        src="3dExport.glb" 
        ar ar-modes="webxr quick-look" ar-scale="fixed"
        camera-controls 
        shadow-intensity="2" 
        exposure="1.2"
        environment-image="neutral">

        <button class="dot-qr" slot="hotspot-0" data-position="0 0 0"></button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');

        // PROCESAMIENTO DE MATERIALES: Color y Opacidad
        viewer.addEventListener('load', () => {
            const model = viewer.model;
            
            model.materials.forEach((material) => {
                // 1. Forzar opacidad total en todos los elementos
                material.setAlphaMode("OPAQUE");

                // 2. Aplicar color naranja a los equipos
                // El script busca materiales que suelen ser de equipos o aplica a todo si prefieres
                const pbr = material.pbrMetallicRoughness;
                
                // Color Naranja Industrial [R, G, B, A]
                pbr.setBaseColorFactor([1.0, 0.4, 0.0, 1.0]);
                
                // Ajuste de realismo: menos rugosidad para un acabado metálico/plástico limpio
                pbr.setRoughnessFactor(0.4);
                pbr.setMetallicFactor(0.3);
            });
        });

        document.querySelector('#btn-update').addEventListener('click', () => {
            const h = document.querySelector('#z-val').value;
            viewer.cameraTarget = `0m ${h}m 0m`;
        });
    </script>
</body>
</html>
