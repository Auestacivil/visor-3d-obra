<!DOCTYPE html>
<html lang="es">
<head>
    <title>Alinco - Inspección Humax V7.0</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #d9534f; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #121212; }
        
        #ui-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255,255,255,0.95); padding: 15px; border-radius: 12px;
            z-index: 100; color: #333; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .btn-update {
            width: 100%; padding: 12px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-weight: bold;
        }

        model-viewer { width: 100vw; height: 100vh; background-color: #222; }
        .dot-qr { width: 20px; height: 20px; border-radius: 50%; background: red; border: 3px solid white; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: var(--primary); margin-bottom: 5px;">ALINCO INGENIERÍA</div>
        <div style="font-size: 12px; margin-bottom: 10px;">MODO: OPACIDAD INDUSTRIAL FORZADA</div>
        <input type="number" id="z-val" value="7.00" step="0.1" style="width: 60px; padding: 5px;"> m
        <button class="btn-update" id="btn-update">APLICAR COTA Z</button>
    </div>

    <model-viewer 
        id="viewer"
        src="3dExport.glb" 
        ar ar-modes="webxr quick-look" ar-scale="fixed"
        camera-controls 
        shadow-intensity="2" 
        shadow-softness="0.5"
        exposure="1.5"
        environment-image="neutral"
        alt="Modelo BIM Alinco">

        <button class="dot-qr" slot="hotspot-0" data-position="0 0 0"></button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');

        // FUNCIÓN MÁGICA: Fuerza a todos los materiales a ser SÓLIDOS
        viewer.addEventListener('load', () => {
            const model = viewer.model;
            
            // Recorremos todos los materiales del modelo
            model.materials.forEach((material) => {
                // Forzamos el modo de mezcla a opaco
                material.setAlphaMode("OPAQUE");
                
                // Si quieres que el metal brille más y se vea más realista:
                const pbr = material.pbrMetallicRoughness;
                pbr.setBaseColorFactor([1, 1, 1, 1]); // Asegura que el color sea pleno
            });
            
            console.log("Opacidad forzada aplicada a todos los ductos.");
        });

        // Control de altura
        document.querySelector('#btn-update').addEventListener('click', () => {
            const h = document.querySelector('#z-val').value;
            viewer.cameraTarget = `0m ${h}m 0m`;
            alert(`Cota ajustada a ${h}m`);
        });
    </script>
</body>
</html>
