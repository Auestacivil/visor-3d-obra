<!DOCTYPE html>
<html lang="es">
<head>
    <title>Visor de Obra - Humax</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f5f5f5; }
        #ar-button {
            background-color: #007bff;
            border-radius: 8px;
            border: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="3dExport.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed" 
        camera-target="-4.85m 4.30m 7.16m" 
        camera-controls 
        shadow-intensity="1" 
        tone-mapping="neutral">
        <button slot="ar-button" id="ar-button">INICIAR REALIDAD AUMENTADA</button>
    </model-viewer>
</body>
</html>
