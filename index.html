<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

    <a-scene 
        mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: yes;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="modeloBim" src="3dExport.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#modeloBim" position="0 0 0" rotation="90 0 0" scale="1 1 1"></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        // Detector de errores para el ingeniero
        const sceneEl = document.querySelector('a-scene');
        sceneEl.addEventListener("arError", (event) => {
            alert("Error de AR: Asegúrate de haber subido el archivo .mind y dar permisos de cámara");
        });
    </script>
</body>
</html>
