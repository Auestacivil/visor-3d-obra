<!DOCTYPE html>
<html lang="es">
<head>
    <title>Alinco - Inspección Alta Fidelidad</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --primary: #004a99; --accent: #d9534f; }
        body { margin: 0; font-family: -apple-system, sans-serif; background-color: #000; }
        
        #ui-panel {
            position: fixed; top: 10px; left: 10px; right: 10px;
            background: rgba(255,255,255,0.92); padding: 15px; border-radius: 12px;
            z-index: 100; color: #333; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border-left: 5px solid var(--primary);
        }

        .btn-update {
            width: 100%; padding: 12px; background: var(--primary);
            color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
        }

        model-viewer { width: 100vw; height: 100vh; background-color: #1a1a1a; }
        .dot-qr { width: 22px; height: 22px; border-radius: 50%; background: #ff0000; border: 3px solid white; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: var(--primary); margin-bottom: 4px;">ALINCO INGENIERÍA</div>
        <div style="font-size: 11px; margin-bottom: 12px; color: #555;">MODO: TEXTURAS ORIGINALES + SOMBRAS HD</div>
        
       <div style="display:flex; gap:5px; margin-bottom:10px;"><button class="btn-update" style="background:#666; font-size:11px; flex:1;" onclick="viewer.cameraTarget='1m 0m 0m'">EJE X</button><button class="btn-update" style="background:#666; font-size:11px; flex:1;" onclick="viewer.cameraTarget='0m 1m 0m'">EJE Y</button><button class="btn-update" style="background:#666; font-size:11px; flex:1;" onclick="viewer.cameraTarget='0m 0m 1m'">EJE Z</button><button class="btn-update" style="background:#444; font-size:11px; flex:1;" onclick="viewer.cameraTarget='0m 0m 0m'">0,0,0</button>
       </div>
        
        <button class="btn-update" id="btn-update">APLICAR COTA DE DISEÑO</button>
    </div>

    <model-viewer 
        id="viewer"
        src="3dExport.glb" 
        ar ar-modes="webxr quick-look" ar-scale="fixed"
        camera-controls 
        
        /* MEJORA DE SOMBRAS Y DETALLE */
        shadow-intensity="2.5" 
        shadow-softness="0.3" 
        exposure="1.2"
        environment-image="neutral"
        tone-mapping="commerce"
        
        alt="Modelo BIM Alinco">

        <button class="dot-qr" slot="hotspot-0" data-position="0 0 0"></button>
    </model-viewer>

    <script>
        const viewer = document.querySelector('#viewer');

        // MANTENER TEXTURAS Y QUITAR TRANSPARENCIAS
        viewer.addEventListener('load', () => {
            const model = viewer.model;
            
            model.materials.forEach((material) => {
                // 1. Quitamos la transparencia pero RESPETAMOS el color y textura original
                material.setAlphaMode("OPAQUE");
                
                // 2. Potenciamos el brillo metálico de las texturas de Revit
                const pbr = material.pbrMetallicRoughness;
                pbr.setRoughnessFactor(0.5); // Ajuste para que el metal no se vea opaco
            });
            
            console.log("Gráficos optimizados: Texturas respetadas.");
        });

        document.querySelector('#btn-update').addEventListener('click', () => {
            const h = document.querySelector('#z-val').value;
            viewer.cameraTarget = `0m ${h}m 0m`;
            // Pequeño feedback táctil
            if (navigator.vibrate) navigator.vibrate(50);
        });
    </script>
</body>
</html>
